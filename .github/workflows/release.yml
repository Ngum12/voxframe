# A release, from a version tag such as v0.1.0 (D-161).
#
# Runs ONLY when the owner pushes a version tag. Builds the Windows installer
# and the macOS app on GitHub's own runners, tests each on its runner, and
# creates a DRAFT release with both, the complete source of the FFmpeg they
# bundle (D-162), a SHA256SUMS file, and the notes from
# .github/release-notes/<tag>.md. The owner reviews the draft and publishes it.
#
# No secrets, no signing certificates, no paid accounts. The owner's API keys
# never come here: the key check that needs them runs on the owner's machine
# before the tag is pushed (docs/RELEASING.md). Here, gitleaks scans the whole
# history instead.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit, for the history scan

      - name: The tag matches the version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"; exit 1; }

      - name: There are release notes for it
        run: test -s ".github/release-notes/$GITHUB_REF_NAME.md"

      - name: Scan the whole history for secrets (gitleaks, MIT)
        id: secret_scan
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact=100 --no-banner --report-format=json --report-path=gitleaks-redacted.json .
      - name: Save the redacted scan report on failure
        if: failure() && steps.secret_scan.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-redacted
          path: gitleaks-redacted.json
          retention-days: 7

  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build tools
        run: |
          choco install nsis -y --no-progress
          python -m pip install --upgrade pip
          pip install build pynsist
      - name: Build the installer
        run: python scripts/build_windows_installer.py --nsis "C:\Program Files (x86)\NSIS" --no-key-check
      - name: Install it, test it, uninstall it
        shell: pwsh
        run: python scripts/test_windows_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/nsis/*.exe

  macos:
    needs: checks
    runs-on: macos-14  # Apple Silicon
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tools
        run: python -m pip install --upgrade pip build
      - name: Build and test the app
        run: python scripts/build_macos_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/*.dmg

  ffmpeg-source:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg's source for each bundled build, checked by pinned SHA-256
        run: python scripts/ffmpeg_sources.py --out ffmpeg-source
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-source
          path: ffmpeg-source/*

  release:
    needs: [windows, macos, ffmpeg-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir upload
          cp artifacts/windows/* artifacts/macos/* artifacts/ffmpeg-source/* upload/
          (cd upload && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" upload/* --draft \
            --title "Voxframe ${GITHUB_REF_NAME#v}" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
